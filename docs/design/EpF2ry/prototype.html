:root{--mono:"IBM Plex Mono",ui-monospace,monospace;--bg:#0f1115;--card:#171a21;--raised:#1f232b;--line:#2c313c;--faint:#4b5261;--dim:#8a919e;--ink2:#c5cad3;--ink:#eef0f3;--brand:#0072b2;--prog:#56b4e9;--ok:#009e73;--attn:#e69f00;--err:#d55e00;--review:#cc79a7;--link:#a6d8f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.45 "Red Hat Display",system-ui,sans-serif}
a,.lnk{color:var(--link);text-decoration:none;cursor:pointer}code{font-family:var(--mono);font-size:.86em;color:#b4bac4}
.app{display:flex;min-height:100vh}
nav.side{width:188px;border-right:1px solid var(--line);padding:16px 12px;flex:none}nav.side b{display:block;margin-bottom:14px}
nav.side div{padding:6px 8px;color:var(--dim);border-radius:8px;cursor:pointer;display:flex;justify-content:space-between}nav.side div.on{color:var(--ink);background:var(--raised)}
nav.tabs{display:none}
main{flex:1;min-width:0;padding:16px 20px 90px;max-width:940px}
h1{font-size:1.25rem;margin:.2rem 0 .8rem;display:flex;gap:8px;align-items:center}h3{font-size:.98rem;margin:0 0 4px}
.badge{background:var(--attn);color:#111;border-radius:999px;font-size:.75rem;font-weight:700;padding:0 8px;min-width:22px;text-align:center;display:inline-block}
.badge.zero{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.meta{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:.85rem;margin-bottom:6px;flex-wrap:wrap}.grow{flex:1}.dim{color:var(--dim)}.small{font-size:.85rem}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--dim)}
.tag.q{color:var(--attn);border-color:var(--attn)}.tag.p{color:var(--review);border-color:var(--review)}.tag.r{color:var(--prog);border-color:var(--prog)}
.proj{font-size:.78rem;border-radius:999px;padding:0 9px;background:var(--raised);color:var(--ink2);cursor:pointer;border:1px solid var(--line)}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand)}.btn.sm{min-height:30px;padding:3px 12px;font-size:.82rem}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* filter: shared */
.n{font-variant-numeric:tabular-nums;color:var(--dim)}.on .n{color:inherit}
.bump{animation:bump .9s}@keyframes bump{0%{transform:scale(1.5);color:var(--attn)}100%{transform:none}}
.remember{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:.82rem;margin:-2px 0 12px}
.remember .lnk{text-decoration:underline}
/* A chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px;scrollbar-width:none}
.chip{font:inherit;font-size:.9rem;flex:none;display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 13px;min-height:40px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip.z{color:var(--dim)}.chip.z:not(.on){border-style:dashed}
/* B dropdown */
.dd{position:relative;display:inline-block;margin-bottom:12px}
.dd .btn{display:flex;gap:8px;align-items:center}.dd .btn b{font-weight:600}
.menu{position:absolute;left:0;top:46px;background:var(--raised);border:1px solid var(--line);border-radius:12px;min-width:270px;padding:6px;z-index:8;box-shadow:0 10px 28px #000a}
.menu .it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px}.menu .it:hover{background:var(--card)}
.menu .it .ck{width:16px;color:var(--prog)}.menu .it.z{color:var(--dim)}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.scrim{display:none}
/* C rail */
.split{display:flex;gap:20px;align-items:flex-start}.rail{width:190px;flex:none;position:sticky;top:16px}
.rail .it{display:block;padding:8px 10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.rail .it .row{display:flex;justify-content:space-between}.rail .it.on{background:var(--raised);color:var(--ink);font-weight:600}.rail .it.z{color:var(--dim)}
.rail .bar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}.rail .bar i{display:block;height:100%;background:var(--attn)}
.rail small{display:block;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem;margin:0 10px 6px}
.list{flex:1;min-width:0}
.phonefilter{display:none}
/* empty */
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--dim)}.empty b{color:var(--ink);display:block;font-size:1.05rem;margin-bottom:4px}
/* tables */
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--dim);font-weight:400;font-size:.8rem;padding:6px 10px}td{padding:11px 10px;border-top:1px solid var(--line)}
.ibadge{display:inline-flex;gap:6px;align-items:center;cursor:pointer;border-radius:999px;padding:0 2px}.ibadge:hover .badge{outline:2px solid var(--link)}
.hintlink{font-size:.75rem;color:var(--faint);margin-left:4px}
.needsyou{border:1px solid var(--attn);background:color-mix(in srgb,var(--attn) 8%,var(--card));border-radius:12px;padding:12px 14px;margin-bottom:14px}
.needsyou .head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.needsyou .mini{padding:7px 0;border-top:1px solid color-mix(in srgb,var(--attn) 25%,var(--line));display:flex;gap:8px;align-items:center}
.toast{position:fixed;right:16px;top:16px;background:var(--raised);border:1px solid var(--attn);padding:8px 14px;border-radius:10px;z-index:30}
.vtag{position:fixed;left:8px;bottom:8px;z-index:40;font:.7rem var(--mono);background:#000c;color:#bbb;padding:4px 8px;border-radius:6px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 16px)}
.vtag button{font:inherit;background:#222;color:#ddd;border:1px solid #444;border-radius:4px;cursor:pointer}.vtag button.on{background:#0072b2;color:#fff}
body.shot .vtag{display:none}
@media (max-width:700px){
 nav.side{display:none}main{padding:12px 12px 90px}
 nav.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);height:58px;z-index:6}
 nav.tabs div{flex:1;text-align:center;padding-top:10px;color:var(--dim);font-size:.75rem}nav.tabs div.on{color:var(--ink)}
 .split{display:block}.rail{display:none}.phonefilter{display:block}
 /* dropdown becomes bottom sheet */
 .dd{display:block}.dd .btn{width:100%;justify-content:space-between}
 .menu{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:16px 16px 0 0;padding:10px 10px 22px;z-index:12}
 .scrim.open{display:block;position:fixed;inset:0;background:#0009;z-index:11}
 table.resp thead{display:none}table.resp tr{display:block;border-top:1px solid var(--line);padding:8px 0}table.resp td{display:inline-block;border:0;padding:3px 10px 3px 0}
}
</style>
<div class="app"><nav class="side" id="side"></nav><main id="main"></main></div><nav class="tabs" id="tabs"></nav><div class="vtag" id="vtag"></div>
<script>
const PROJ=['pnp','wrangl','devhost'];
const seed=()=>[
 {id:1,p:'pnp',kind:'q',tag:'Question',task:'Q7xK2m',tt:'Import legacy playlists',title:'Should duplicate tracks be merged or kept?',body:'The importer found 41 duplicate tracks across 6 playlists. Merging changes play counts.',age:'12m',a:['Answer','Skip']},
 {id:2,p:'pnp',kind:'r',tag:'PR review',task:'b3Nw9z',tt:'Offline queue for the mobile app',title:'Review PR #212 — offline queue',body:'3 files changed, tests green.',age:'1h',a:['Approve','Request changes']},
 {id:3,p:'devhost',kind:'p',tag:'Plan',task:'k8Rt1c',tt:'Cache warm-up on deploy',title:'Approve plan: warm cache before cutover',body:'4 steps, est. 25 minutes of agent time.',age:'3h',a:['Approve plan','Comment']}];
const V=location.hash.slice(1).split('-');
const S={v:V[0]||'A',scr:V[1]||'inbox',f:V[2]||'all',open:V[3]==='open',items:seed(),mem:null,toast:'',bumped:''};
if(S.f!=='all')S.mem=S.f;
const cnt=p=>p==='all'?S.items.length:S.items.filter(i=>i.p===p).length;
const vis=()=>S.f==='all'?S.items:S.items.filter(i=>i.p===S.f);
const b=(p)=>{const c=cnt(p);return `<span class="badge ${c?'':'zero'} ${S.bumped===p?'bump':''}">${c}</span>`};
const n=(p)=>`<span class="n ${S.bumped===p?'bump':''}">${cnt(p)}</span>`;
function setF(f){S.f=f;S.mem=f;S.open=false;render()}
function go(scr,f){S.scr=scr;if(f){S.f=f;S.mem=f}else if(scr==='inbox'&&S.mem)S.f=S.mem;S.open=false;render()}
function act(id){const it=S.items.find(i=>i.id===id);S.items=S.items.filter(i=>i.id!==id);S.bumped=it.p;S.toast=`Done — ${it.p} now ${cnt(it.p)}`;render();S.bumped='';setTimeout(()=>{S.toast='';render()},2200)}
function arrive(){S.items.push({id:Date.now(),p:'wrangl',kind:'q',tag:'Question',task:'m4Zq8d',tt:'Archive projects: UI',title:'Hide archived projects from the Tasks list too?',body:'The spec only mentions Inbox and search.',age:'now',a:['Answer','Skip']});S.bumped='wrangl';S.toast='New in wrangl — count updated live';render();S.bumped='';setTimeout(()=>{S.toast='';render()},2200)}
function card(i){return `<section class="card"><div class="meta"><span class="tag ${i.kind}">${i.tag}</span>${S.f==='all'?`<span class="proj" onclick="setF('${i.p}')" title="Filter to ${i.p}">${i.p}</span>`:''}<a>${i.tt}</a> <code>${i.task}</code><span class="grow"></span><span>${i.age}</span></div><h3>${i.title}</h3><div class="dim small">${i.body}</div><div class="actions">${i.a.map((x,k)=>`<button class="btn sm ${k?'':'primary'}" onclick="act(${i.id})">${x}</button>`).join('')}</div></section>`}
function list(){const v=vis();if(v.length)return v.map(card).join('');
 if(S.f==='all')return `<div class="empty"><b>Inbox zero</b>Questions from agents, plan proposals, task reviews and PR reviews land here.</div>`;
 const other=S.items.length;return `<div class="empty"><b>Nothing needs you in ${S.f}</b>${other?`${other} item${other>1?'s':''} waiting in other projects. `:''}<a class="lnk" onclick="setF('all')">Show all${other?` (${other})`:''}</a></div>`}
function remember(){return S.mem&&S.mem!=='all'&&S.f===S.mem?`<div class="remember">Filter remembered for this session · <a class="lnk" onclick="setF('all')">Show all</a></div>`:''}
const filtA=()=>`<div class="chips" role="tablist" aria-label="Filter by project">${['all',...PROJ].map(p=>`<button class="chip ${S.f===p?'on':''} ${cnt(p)?'':'z'}" aria-pressed="${S.f===p}" onclick="setF('${p}')">${p==='all'?'All':p} ${n(p)}</button>`).join('')}</div>`;
const filtB=()=>`<div class="dd"><button class="btn" aria-haspopup="menu" onclick="S.open=!S.open;render()"><span class="dim">Project</span> <b>${S.f==='all'?'All projects':S.f}</b> ${n(S.f)} <span class="dim"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4l4 4 4-4"/></svg></span></button><div class="scrim ${S.open?'open':''}" onclick="S.open=false;render()"></div>${S.open?`<div class="menu" role="menu">${['all',...PROJ].map((p,k)=>`${k==1?'<hr>':''}<div class="it ${cnt(p)?'':'z'}" role="menuitemradio" onclick="setF('${p}')"><span class="ck">${S.f===p?'<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7.5l3.5 3.5L12 3.5"/></svg>':''}</span><span class="grow">${p==='all'?'All projects':p}</span>${n(p)}</div>`).join('')}</div>`:''}</div>`;
const rail=()=>`<aside class="rail"><small>Project</small>${['all',...PROJ].map(p=>`<div class="it ${S.f===p?'on':''} ${cnt(p)?'':'z'}" onclick="setF('${p}')"><div class="row"><span>${p==='all'?'All':p}</span>${n(p)}</div>${p==='all'?'':`<div class="bar"><i style="width:${S.items.length?cnt(p)/S.items.length*100:0}%"></i></div>`}</div>`).join('')}</aside>`;
function inbox(){const t=`<h1>Inbox ${b('all')}</h1>`;
 if(S.v==='C')return t+`<div class="phonefilter">${filtB()}</div><div class="split">${rail()}<div class="list">${remember()}${list()}</div></div>`;
 return t+(S.v==='A'?filtA():filtB())+remember()+list()}
function projects(){const inbox=p=>`<a class="ibadge" onclick="go('inbox','${p}')" title="Open Inbox filtered to ${p}">${b(p)}</a>`;
 return `<h1>Projects</h1><div class="card" style="padding:4px 8px"><table class="resp"><thead><tr><th>Project</th><th>Inbox</th><th>Running</th><th>Queued</th></tr></thead>${PROJ.map((p,k)=>`<tr><td><a onclick="go('project','${p}')">${p}</a></td><td>${inbox(p)}</td><td>${[1,0,2][k]}</td><td>${[3,1,0][k]}</td></tr>`).join('')}</table></div><p class="dim small">The Inbox badge opens the Inbox already filtered to that project — even when it is 0.</p>`}
function project(){const p=S.pj||'pnp';const it=S.items.filter(i=>i.p===p);
 return `<h1>${p}</h1>${it.length?`<section class="needsyou"><div class="head"><h3 style="margin:0">Needs you</h3>${b(p)}<span class="grow"></span><a class="btn sm" onclick="go('inbox','${p}')">Open Inbox →</a></div>${it.map(i=>`<div class="mini"><span class="tag ${i.kind}">${i.tag}</span><span class="grow">${i.title}</span><span class="dim small">${i.age}</span></div>`).join('')}</section>`:'<p class="dim">Nothing needs you in this project.</p>'}<div class="card"><h3>Tasks</h3><div class="dim small">Queued 3 · Running 1 · Done 14</div></div>`}
function render(){
 const sc=S.scr;const nav=[['inbox','Inbox'],['projects','Projects'],['project','Tasks']];
 side.innerHTML='<b>wrangl</b>'+[['inbox','Inbox'],['projects','Projects']].map(([k,l])=>`<div class="${(sc===k||(k==='projects'&&sc==='project'))?'on':''}" onclick="go('${k}')">${l}${k==='inbox'?b('all'):''}</div>`).join('');
 tabs.innerHTML=[['inbox','Inbox'],['projects','Projects']].map(([k,l])=>`<div class="${(sc===k||(k==='projects'&&sc==='project'))?'on':''}" onclick="go('${k}')">${l}${k==='inbox'?' ('+cnt('all')+')':''}</div>`).join('');
 main.innerHTML=(sc==='inbox'?inbox():sc==='projects'?projects():project())+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 vtag.innerHTML=['A','B','C'].map(v=>`<button class="${S.v===v?'on':''}" onclick="S.v='${v}';render()">${v}</button>`).join('')+['inbox','projects','project'].map(s=>`<button class="${sc===s?'on':''}" onclick="go('${s}')">${s}</button>`).join('')+`<button onclick="arrive()">+ wrangl question</button><button onclick="S.items=seed();S.f='all';S.mem=null;render()">reset</button>`;
}
render();
</script>
