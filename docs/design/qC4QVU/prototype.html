<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>wrangl — PR conflicts surfacing (qC4QVU)</title>
<style>
@font-face{font-family:"Red Hat Display";font-weight:300 900;src:url(fonts/red-hat-display-latin.woff2)}@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin.woff2)}
:root{--bg:#0f1115;--card:#171a21;--raised:#1f232b;--line:#2c313c;--faint:#4b5261;--dim:#8a919e;--ink2:#c5cad3;--ink:#eef0f3;--brand:#0072b2;--prog:#56b4e9;--ok:#009e73;--attn:#e69f00;--wait:#f0e442;--err:#d55e00;--review:#cc79a7;--link:#a6d8f5;--mono:"IBM Plex Mono",ui-monospace,monospace;--conf:#ff8a4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.45 "Red Hat Display",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:9;background:#0a0c10;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--dim)}
.bar button{font:inherit;color:var(--ink2);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}.bar button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 40px}
h2.s{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:26px 0 8px;font-weight:600}
code,.mono{font-family:var(--mono);font-size:.84em}.sqid{font-family:var(--mono);color:#b4bac4;font-size:.84em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap;border:1px solid currentColor;background:color-mix(in srgb,currentColor 14%,transparent);display:inline-flex;gap:4px;align-items:center}
.tag.pr{color:var(--review)}.tag.ok{color:var(--ok)}.tag.conf{color:var(--conf)}.tag.blk{color:var(--wait);border-style:dashed}.tag.unk{color:var(--dim);border-style:dotted}.tag.low{color:var(--ok)}.tag.att{color:var(--attn)}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;border-radius:999px;white-space:nowrap}
.btn.p{background:var(--brand);border-color:var(--brand)}.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.dis{opacity:.4;text-decoration:line-through}.btn.sm.dis{text-decoration:none}
.btn.sm.fix{background:var(--conf);border-color:var(--conf);color:#1a0e05;font-weight:600}
.btn.fix{background:var(--conf);border-color:var(--conf);color:#1a0e05;font-weight:600}
.dim{color:var(--dim)}.ink2{color:var(--ink2)}
.ban{border:1px solid color-mix(in srgb,var(--conf) 55%,var(--line));background:color-mix(in srgb,var(--conf) 11%,transparent);border-radius:10px;padding:10px 12px;margin:10px 0}
.ban b{color:var(--conf)}
.files{font-family:var(--mono);font-size:.78rem;color:var(--ink2);margin:6px 0 0;padding-left:0;list-style:none}.files li:before{content:"× ";color:var(--conf)}
.chk{display:grid;gap:6px;margin:10px 0}.chk div{display:flex;gap:8px;align-items:baseline}.chk i{font-style:normal;width:1.2em;text-align:center;font-weight:700}
.i-ok{color:var(--ok)}.i-bad{color:var(--conf)}.i-unk{color:var(--dim)}.i-blk{color:var(--wait)}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.term{background:#07080b;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:400 .8rem/1.5 var(--mono);color:#cfd5de;overflow-x:auto;white-space:pre}
.term .h{color:var(--dim)}.term .c{color:var(--conf)}.term .g{color:var(--ok)}.term .y{color:var(--wait)}.term .d{color:var(--dim)}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em;margin-right:4px}.tag .ic{margin:0}.btn .ic{margin-right:6px}.chk i .ic{margin:0}.files li:before{font-weight:700}
.tl{border-left:2px solid var(--line);margin:10px 0 0 6px;padding-left:14px;font-size:.88rem}.tl div{margin:6px 0;color:var(--ink2)}.tl small{color:var(--dim)}
.note{font-size:.82rem;color:var(--dim);margin:6px 0 0}
.seg{display:inline-flex}.seg .btn{border-radius:999px 0 0 999px}.seg .btn+.btn{border-radius:0 999px 999px 0;border-left:0;padding:8px 10px}
@media(max-width:560px){.term{font-size:.66rem;padding:10px}.wrap{padding:8px 10px 40px}.hide-m{display:none}.btn{padding:8px 12px}}
</style>
<div class="bar"><span>Variant</span><span id="vs"></span><span style="margin-left:12px">PR state</span><span id="ss"></span></div>
<div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);
let V=(location.hash||'#A').slice(1),S=new URLSearchParams(location.search).get('s')||'conflicted';
const VN={A:'A · Tag + banner',B:'B · Readiness checklist',C:'C · Quiet tag, loud action'};
const SN={clean:'clean',conflicted:'conflicts',blocked:'blocked',unknown:'checking'};
function tag(s){return {clean:'<span class="tag ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg> mergeable</span>',conflicted:'<span class="tag conf"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> conflicts</span>',blocked:'<span class="tag blk"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" stroke-dasharray="2 2"/></svg> blocked</span>',unknown:'<span class="tag unk"><svg class="ic" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/></svg> checking</span>'}[s]}
const files='<ul class="files"><li>cmd/wrangl/internal/web/inbox.go</li><li>docs/wrangl/pr.md</li></ul>';
function actions(s,small){
  const b=small?'btn sm':'btn';
  if(s==='conflicted')return `<span class="${b} fix"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Smart Merge</span><span class="${b} dis">Approve &amp; merge</span><span class="${b}">Request changes</span>`;
  if(s==='unknown')return `<span class="${b} p dis">Approve &amp; merge</span><span class="${b}">Request changes</span>`;
  return `<span class="${b} p">Approve &amp; merge</span><span class="${b}">Request changes</span>`;
}
const head=(s,extra='')=>`<div class="row"><span class="tag pr">PR #42</span>${extra}<span class="tag att">risk medium</span><span class="sp"></span><span class="sqid">3kQ9xa</span></div><h3 style="margin:8px 0 2px;font-size:1.02rem">Inbox: one card for questions, reviews and PRs</h3><div class="dim" style="font-size:.84rem">acme/app · wrangl/3kq9xa-1 · +212 −48 · checks passed</div>`;
const why={conflicted:'This PR conflicts with <code>main</code> (2 files). Approve &amp; merge is off until it is resolved.',blocked:'Mergeable, but branch protection blocks the merge (required review missing).',unknown:'GitHub is still computing mergeability; refreshes by itself.'};
const tl=`<div class="tl"><div><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Conflicts with <code>main</code> detected <small>· 4 min ago, after a push to main (#41 merged)</small></div><div><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg> Review: medium risk <small>· 1 h ago</small></div><div>PR opened <small>· 2 h ago</small></div></div>`;
function inbox(s){
 if(V==='A')return `<div class="card">${head(s,tag(s))}${s==='conflicted'?`<div class="ban"><b>Conflicts with main.</b> An agent can merge main into this branch, resolve both sides and push — no force-push.${files}<div class="note">Auto-resolve is off for this project.</div></div>`:(why[s]?`<div class="note" style="margin:10px 0">${why[s]}</div>`:'')}<div class="actions row" style="margin-top:10px">${actions(s)}</div></div>`;
 if(V==='B')return `<div class="card">${head(s)}<div class="chk"><div><i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>Checks passed</div><div><i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>Review: medium risk — needs you</div><div>${{clean:'<i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>No conflicts with main',conflicted:'<i class="i-bad">×</i><span><b style="color:var(--conf)">Conflicts with main</b> <span class="dim">· 2 files</span></span>',blocked:'<i class="i-blk"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" stroke-dasharray="2 2"/></svg></i>Blocked by branch protection',unknown:'<i class="i-unk"><svg class="ic" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/></svg></i>Checking mergeability'}[s]}</div></div>${s==='conflicted'?files:''}<div class="row" style="margin-top:12px">${actions(s)}</div></div>`;
 return `<div class="card" style="${s==='conflicted'?'border-left:4px solid var(--conf)':''}">${head(s,s==='clean'?'':tag(s))}<div class="row" style="margin-top:12px">${s==='conflicted'?`<span class="btn fix" style="flex:1;text-align:center"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Resolve conflicts with Smart Merge</span><span class="btn hide-m">Request changes</span><span class="btn dis hide-m">Approve</span>`:actions(s)}</div>${s==='conflicted'?'<div class="note">Approve &amp; merge returns once the branch is conflict-free.</div>':''}</div>`;
}
function task(s){
 const body=V==='A'?`<div class="row"><b>Pull request</b><a style="color:var(--link)">#42</a>${tag(s)}<span class="tag att">risk medium</span></div>${s==='conflicted'?`<div class="ban"><b>Conflicts with main</b> — 2 files${files}<div class="row" style="margin-top:8px"><span class="btn sm fix"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Smart Merge</span><span class="btn sm">Open on GitHub</span></div></div>`:''}${s==='conflicted'?tl:''}`
 :V==='B'?`<div class="row"><b>Pull request</b><a style="color:var(--link)">#42</a><span class="tag att">risk medium</span></div><div class="chk"><div><i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>Checks passed</div><div><i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>Reviewed at this commit</div><div>${{clean:'<i class="i-ok"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></i>Mergeable',conflicted:'<i class="i-bad">×</i><b style="color:var(--conf)">Conflicts with main</b>',blocked:'<i class="i-blk"><svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" stroke-dasharray="2 2"/></svg></i>Blocked by branch protection',unknown:'<i class="i-unk"><svg class="ic" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/></svg></i>Checking mergeability'}[s]}</div></div>${s==='conflicted'?`${files}<div class="row" style="margin-top:8px"><span class="btn sm fix"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Smart Merge</span></div>${tl}`:''}`
 :`<div class="row"><b>Pull request</b><a style="color:var(--link)">#42</a>${s==='clean'?'':tag(s)}<span class="sp"></span>${s==='conflicted'?'<span class="btn sm fix"><svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.6 3.8L10.4 7M5.6 12.2L10.4 9" /></svg> Smart Merge</span>':''}</div>${s==='conflicted'?`<div class="note">2 files conflict with main: <code>inbox.go</code>, <code>pr.md</code></div>`:''}`;
 return `<div class="card"><div class="row" style="margin-bottom:8px"><b style="font-size:1.05rem">Inbox: one card for questions…</b><span class="sp"></span><span class="tag att">in review</span></div>${body}</div>`;
}
function cli(s){
 const st={clean:'clean',conflicted:'<span class="c">CONFLICTS</span>',blocked:'<span class="y">blocked</span>',unknown:'<span class="d"><svg class="ic" viewBox="0 0 16 16"><circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/></svg></span>'}[s];
 const list=`<span class="h">ID  TASK    STATE  RISK    CHECKS   CONFLICT   TITLE</span>\n42  3kQ9xa  open   medium  success  ${st}${s==='conflicted'?'':' '.repeat(0)}${s==='conflicted'?'  ':{clean:'      ',blocked:'    ',unknown:'          '}[s]} Inbox: one card…\n41  8Hd2Lm  merged low    success  <span class="d">—</span>          Change links`;
 const show=`PR #42  acme/app  <span class="d">3kQ9xa</span>  Inbox: one card…\nstate     open   risk medium   checks success\nmergeable ${{clean:'<span class="g">clean</span>',conflicted:'<span class="c">CONFLICTS with main</span>  (2 files)',blocked:'<span class="y">blocked</span> (branch protection)',unknown:'<span class="d">unknown (GitHub is computing)</span>'}[s]}${s==='conflicted'?`\n  <span class="c">×</span> cmd/wrangl/internal/web/inbox.go\n  <span class="c">×</span> docs/wrangl/pr.md\n<span class="d">next: wrangl pr resolve 42   # Smart Merge</span>`:''}`;
 return `<div class="term">$ wrangl pr list\n${list}</div><div style="height:8px"></div><div class="term">$ wrangl pr show 42\n${show}</div>`;
}
function render(){
 $('#vs').innerHTML=Object.keys(VN).map(k=>`<button class="${k===V?'on':''}" onclick="V='${k}';location.hash=k;render()">${VN[k]}</button>`).join(' ');
 $('#ss').innerHTML=Object.keys(SN).map(k=>`<button class="${k===S?'on':''}" onclick="S='${k}';render()">${SN[k]}</button>`).join(' ');
 $('#app').innerHTML=`<h2 class="s">Inbox · pr_review card</h2>${inbox(S)}<h2 class="s">Task page · PR panel</h2>${task(S)}<h2 class="s">CLI</h2>${cli(S)}`;
}
render();addEventListener('hashchange',()=>{V=location.hash.slice(1)||'A';render()});
</script></html>
