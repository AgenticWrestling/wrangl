<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eQHELl projects list</title>
<style>
@font-face{font-family:'Red Hat Display';src:url(fonts/red-hat-display-latin.woff2) format('woff2');font-weight:300 900}
:root{--bg:#0f1115;--card:#171a21;--raised:#1f232b;--line:#2c313c;--ink:#eef0f3;--ink2:#c5cad3;--dim:#8a919e;--prog:#56b4e9;--attn:#e69f00;--link:#a6d8f5;--brand:#0072b2;--err:#d55e00;--ok:#009e73;--wait:#f0e442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.45 'Red Hat Display',system-ui,sans-serif;padding:18px;max-width:980px}
h1{font-size:1.3rem;margin:0}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.grow{flex:1}.dim{color:var(--dim)}.small{font-size:.8rem}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}.btn.primary{background:var(--brand);border-color:var(--brand)}.btn.small{padding:4px 10px;font-size:.8rem}.btn.danger{color:var(--err);border-color:#d55e0073}
.wrap{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--dim);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}td{padding:9px 12px;border-top:1px solid var(--line)}th.n,td.n{text-align:right}
tr.x{cursor:pointer}tr.x:hover td{background:var(--raised)}tr.more td{background:var(--raised);padding:8px 14px 14px}
.tag{font-size:.78rem;border:1px solid var(--line);border-radius:9px;padding:0 8px}.attn{color:var(--attn);border-color:#e69f0066}.wait{color:var(--wait);border-style:dashed}
code{font-family:ui-monospace,monospace;font-size:.8rem;color:#b4bac4}.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}h4{margin:4px 0;font-size:.78rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}p{margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--raised);border-radius:8px;padding:2px 8px;font-size:.82rem}.chip b{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--raised);display:flex;overflow:hidden;margin-top:6px}.bar i{display:block}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.mc .h{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 12px}.mc .h .t{flex:1 0 100%}.mc .b{padding:4px 12px 12px;background:var(--raised)}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}.form input{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font:inherit;margin:4px 0 8px}
.sw{position:fixed;left:8px;bottom:8px;background:#000c;padding:6px 8px;border-radius:8px;font-size:12px;display:flex;gap:6px}.sw a{color:var(--link);text-decoration:none}body.shot .sw{display:none}
.desk{display:block}.ph{display:none}@media(max-width:700px){.desk{display:none}.ph{display:block}body{padding:12px}.cols{grid-template-columns:1fr}}
</style></head><body><div class="sw"><a href="#A">A</a><a href="#A-form">A+form</a><a href="#B">B</a><a href="#C">C</a></div><div id="app"></div>
<script>
const D=[{s:'wrangl',n:'wrangl',r:2,p:3,q:4,b:11,i:2,a:'Self-hosted agent fleet and web UI',run:[['devhost',2,[]],['mac-1',1,['mobile-app']]],rec:[['✓','Add retry to uploader','5m ago'],['▶','Projects list page','12m ago'],['○','Docs pass','2h ago']],open:1},
{s:'web',n:'Website',r:1,p:1,q:0,b:7,i:0,a:'Marketing site and docs',run:[['devhost',1,[]]],rec:[['▶','Hero copy','1h ago']]},
{s:'mobile-app',n:'Mobile app',r:1,p:0,q:2,b:5,i:1,a:'Android client for the inbox',run:[['mac-1',1,['wrangl']]],rec:[['○','Push tokens','3h ago']]},
{s:'infra',n:'Infra',r:0,p:0,q:0,b:3,i:0,a:'Terraform and runner images',run:[],rec:[['✓','Rotate keys','2d ago']]}];
const c=n=>n?n:'<span class="dim">0</span>';
function ex(p,v){return `${'' }<p><span class="dim">About</span> ${p.a}</p><div class="cols"><div><h4>Runners now</h4>${p.run.map(r=>`<p>${r[0]} <span class="dim small">${r[1]} session${r[1]>1?'s':''}</span>${r[2].length?` <span class="tag wait">also serving ${r[2]}</span>`:''}</p>`).join('')||'<p class="dim">None running.</p>'}</div><div><h4>Recent activity</h4>${p.rec.map(r=>`<p>${r[0]} ${r[1]} <span class="dim small">${r[2]}</span></p>`).join('')}</div></div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary small">Open</button><button class="btn small">Comment</button><button class="btn small">Edit</button><button class="btn small danger">Archive</button></div>`}
function A(open,form){return `<div class="top"><h1>Projects</h1><span class="grow"></span><button class="btn primary">＋ New project</button></div>${form?`<div class="form"><b>New project</b><input placeholder="Slug (my-app)"><input placeholder="Name (optional)"><input placeholder="Repositories owner/name"><div style="display:flex;gap:8px"><button class="btn">Cancel</button><button class="btn primary">Create</button></div></div>`:''}
<div class="desk wrap"><table><thead><tr><th>Project</th><th class="n">Runners</th><th class="n">In progress</th><th class="n">Queued</th><th class="n">Backlog</th><th class="n">Inbox</th></tr></thead>${D.map((p,i)=>`<tbody><tr class="x"><td>${open&&i==0?'▾':'▸'} <b>${p.n}</b> <code>${p.s}</code></td><td class="n">${c(p.r)}</td><td class="n">${c(p.p)}</td><td class="n">${c(p.q)}</td><td class="n">${c(p.b)}</td><td class="n">${p.i?`<span class="tag attn">${p.i}</span>`:c(0)}</td></tr>${open&&i==0?`<tr class="more"><td colspan="6">${ex(p)}</td></tr>`:''}</tbody>`).join('')}</table></div>
<div class="ph">${D.map((p,i)=>`<div class="mc"><div class="h"><div class="t">${open&&i==0?'▾':'▸'} <b>${p.n}</b> <code>${p.s}</code></div><span class="dim small">Runners ${p.r}</span><span class="dim small">In progress ${p.p}</span><span class="dim small">Queued ${p.q}</span><span class="dim small">Backlog ${p.b}</span>${p.i?`<span class="tag attn">${p.i} need you</span>`:''}</div>${open&&i==0?`<div class="b">${ex(p)}</div>`:''}</div>`).join('')}</div>
<details style="margin-top:12px" class="form"><summary>Archived projects <span class="dim small">2</span></summary></details>`}
function B(){return `<div class="top"><h1>Projects</h1><span class="grow"></span><button class="btn primary">＋ New project</button></div><div class="grid">${D.map(p=>`<div class="card"><div style="display:flex;gap:8px;align-items:center"><b>${p.n}</b><code>${p.s}</code><span class="grow"></span>${p.i?`<span class="tag attn">${p.i} need you</span>`:''}</div><div class="dim small">${p.a}</div><div class="chips"><span class="chip"><b>${p.r}</b> runners</span><span class="chip"><b>${p.p}</b> running</span><span class="chip"><b>${p.q}</b> queued</span><span class="chip"><b>${p.b}</b> backlog</span></div><div class="bar"><i style="width:${p.p*14}%;background:var(--prog)"></i><i style="width:${p.q*8}%;background:var(--wait)"></i><i style="width:${p.b*3}%;background:var(--line)"></i></div></div>`).join('')}</div>`}
function C(){return `<div class="top"><h1>Projects</h1><span class="grow"></span><button class="btn primary">＋ New</button></div><div class="wrap"><table><thead><tr><th>Project</th><th class="n">Run</th><th class="n">Prog</th><th class="n">Q</th><th class="n">Backlog</th><th class="n">Inbox</th><th></th></tr></thead>${D.map(p=>`<tr><td><b>${p.n}</b><div class="dim small">${p.a}</div></td><td class="n">${c(p.r)}</td><td class="n">${c(p.p)}</td><td class="n">${c(p.q)}</td><td class="n">${c(p.b)}</td><td class="n">${p.i?`<span class="tag attn">${p.i}</span>`:c(0)}</td><td class="n"><button class="btn small">Open</button> <button class="btn small">⋯</button></td></tr>`).join('')}</table></div><p class="dim small" style="margin-top:8px">No expansion: details live on the project page; actions in a ⋯ menu.</p>`}
function render(){const h=location.hash.slice(1)||'A';document.body.className=location.search.includes('shot')?'shot':'';
 app.innerHTML=h=='B'?B():h=='C'?C():A(true,h=='A-form');}
addEventListener('hashchange',render);render();
</script></body></html>
