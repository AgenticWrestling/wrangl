<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1x0fji project page</title>
<style>
@font-face{font-family:'Red Hat Display';src:url(fonts/red-hat-display-latin.woff2) format('woff2');font-weight:300 900}
:root{--bg:#0f1115;--card:#171a21;--raised:#1f232b;--line:#2c313c;--ink:#eef0f3;--ink2:#c5cad3;--dim:#8a919e;--prog:#56b4e9;--attn:#e69f00;--link:#a6d8f5;--brand:#0072b2;--err:#d55e00;--ok:#009e73;--wait:#f0e442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.45 'Red Hat Display',system-ui,sans-serif;padding:18px;max-width:980px}
h1{font-size:1.4rem;margin:0 0 2px}code{font-family:ui-monospace,monospace;font-size:.8rem;color:#b4bac4}.dim{color:var(--dim)}.small{font-size:.8rem}.grow{flex:1}
.about{margin:0 0 10px;color:var(--ink2)}.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;position:relative}
.chip{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;background:transparent;color:var(--ink2);font-family:inherit}.chip.on{border-color:var(--prog);color:var(--ink)}.chip.link{color:var(--link)}
.btn{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:5px 12px;border-radius:999px}.btn.danger{color:var(--err);border-color:#d55e0073}.btn.primary{background:var(--brand);border-color:var(--brand);font-size:.9rem;padding:8px 14px}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:9px;padding:0 8px}.wait{color:var(--wait);border-style:dashed}
.pop{position:absolute;top:44px;left:0;width:440px;max-height:330px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 8px 24px #000a;z-index:5}
.rr{padding:6px 0;border-top:1px solid var(--line)}.rr:first-child{border-top:0}.rs{margin-left:12px;font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.sec h3{margin:14px 0 6px;font-size:1rem}.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}.menu{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:6;box-shadow:0 8px 24px #000a}.menu div{padding:8px 14px}
.sw{position:fixed;left:8px;bottom:8px;background:#000c;padding:6px 8px;border-radius:8px;font-size:12px;display:flex;gap:6px;z-index:9}.sw a{color:var(--link);text-decoration:none}body.shot .sw{display:none}
@media(max-width:700px){body{padding:12px}.pop{position:fixed;left:8px;right:8px;width:auto;top:auto;bottom:12px;max-height:60vh}.panel{grid-template-columns:1fr}}
</style></head><body><div class="sw"><a href="#A">A</a><a href="#A-open">A open</a><a href="#B">B</a><a href="#C">C</a><a href="#C-menu">C menu</a></div><div id="app"></div>
<script>
const R=[['devhost','busy','linux',[['Add retry to uploader',412,'running'],['Docs pass',415,'running']],''],['mac-1','busy','mac',[['Push tokens',409,'needs_input']],'mobile-app'],['linux-3','busy','linux',[['Hero copy',417,'running']],'web'],['linux-4','idle','linux',[['Rotate keys',418,'pushing']],''],['linux-5','busy','linux',[['Cache layer',420,'running']],''],['mac-2','busy','mac',[['Icon set',421,'running']],'mobile-app, web'],['linux-6','busy','linux',[['Search index',422,'running']],''],['linux-7','busy','linux',[['Telemetry',423,'running']],'']];
const rr=()=>R.map(r=>`<div class="rr"><b>${r[0]}</b> <span class="tag">${r[1]}</span> <span class="dim small">${r[2]}</span>${r[4]?` <span class="tag wait">also serving ${r[4]}</span>`:''}${r[3].map(s=>`<div class="rs"><span style="color:var(--link)">${s[0]}</span> <span class="dim">run #${s[1]} · ${s[2]}</span></div>`).join('')}</div>`).join('');
const head=`<h1>wrangl <code>wrangl</code></h1><p class="about">Self-hosted agent fleet and web UI</p>`;
const sections=`<div class="bar"><span class="chip">In progress 3</span><span class="grow"></span><button class="btn primary">＋ New task</button></div><div class="sec"><h3>In progress <span class="dim small">3</span></h3><div class="row">▶ Add retry to uploader <span class="tag" style="color:var(--link)">↑ Uploader epic</span> <span class="tag">▶ devhost</span></div><div class="row">▶ Docs pass <span class="tag" style="color:var(--link)">↑ Docs</span> <span class="tag">▶ devhost</span></div><h3>Queue <span class="dim small">4</span></h3><div class="row">⧗ Cache layer <span class="tag wait">queued</span></div><h3>Backlog</h3><div class="row">○ Search index</div><p class="small"><span class="chip link">show done</span></p></div>`;
function A(open){return head+`<div class="strip"><span class="chip">you/wrangl</span><span class="chip">you/docs</span><span class="chip on">runners 8 active</span><span class="chip">concurrency linux ×6 · mac ×2</span><span class="chip on">auto-merge</span><span class="chip link">Edit goals &amp; repos</span><span class="grow"></span><button class="btn danger">Archive</button>${open?`<div class="pop">${rr()}</div>`:''}</div>`+sections}
function B(){return head+`<div class="strip"><span class="chip">you/wrangl</span><span class="chip">you/docs</span><span class="chip on">▾ runners 8 active</span><span class="chip">concurrency linux ×6 · mac ×2</span><span class="chip on">auto-merge</span><span class="chip link">Edit goals &amp; repos</span><span class="grow"></span><button class="btn danger">Archive</button></div><div class="panel">${rr()}</div>`+sections}
function C(menu){return head.replace('</h1>','</h1>')+`<div class="strip"><span class="small dim">you/wrangl, you/docs · </span><span class="chip on">8 runners</span><span class="chip">6+2 slots</span><span class="chip on">auto-merge</span><span class="grow"></span><span class="chip link">Edit goals &amp; repos</span><button class="chip" style="font-size:1rem">⋯</button>${menu?`<div class="menu"><div>Edit goals &amp; repos</div><div>Runners (8)</div><div style="color:var(--err)">Archive…</div></div>`:''}</div>`+sections}
function render(){const h=location.hash.slice(1)||'A';document.body.className=location.search.includes('shot')?'shot':'';app.innerHTML=h=='A-open'?A(1):h=='B'?B():h=='C'?C(0):h=='C-menu'?C(1):A(0)}
addEventListener('hashchange',render);render();
</script></body></html>
