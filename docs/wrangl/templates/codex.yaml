# EXPERIMENTAL. OpenAI Codex CLI, headless drive. Derived from the openai/codex source at
# main 67f0994b (release 0.166.0, 2026-10-29): codex-rs/{hooks,exec,login,config}.
# developers.openai.com could not be reached when this was written; not yet run on a runner.
#
# Source-confirmed:
#   - Hooks are stable and on by default, Claude-style, from $CODEX_HOME/hooks.json.
#     User/project hooks only run when trusted by hash, or with
#     --dangerously-bypass-hook-trust (for automation that vets its hooks: wrangl writes
#     this file itself). Without the flag the hooks silently do not run.
#   - Events used: SessionStart, PostToolUse, PermissionRequest (nearest to Notification;
#     Codex has no Notification event), Stop. The Stop output contract matches Claude's,
#     so --continue-format codex (= claude) works for an interactive Codex template.
#   - `codex exec --json` prints {"type":"thread.started","thread_id":...} first; wrangl
#     reads it into {{.AgentSessionID}}, and `exec resume <id>` resumes exactly that
#     thread (`--last` is racy). There is no flag to choose the id up front.
#   - Auth: `codex exec` reads CODEX_API_KEY (OPENAI_API_KEY alone is NOT read by exec).
#     Alternative: CODEX_ACCESS_TOKEN (an `at-` ChatGPT personal access token, no refresh).
#     Do NOT copy one ChatGPT-login auth.json to several runners: refresh tokens are
#     single-use (refresh_token_reused), so the first refresh logs the others out.
#   - MCP servers in $CODEX_HOME/config.toml are used by exec; project .codex/ config is
#     ignored in untrusted folders, so everything goes in $CODEX_HOME (~/.codex).
# Unconfirmed: PAT minting/lifetime, plan rate limits with many runners on one account,
#   whether the hook session_id equals thread_id (wrangl prefers the printed thread_id).
#
#   wrangl controller secret set codex_api_key        # an OpenAI API key
name: codex
arch: arm64
min: { vcpu: 2, ram: 8GiB, disk: 40GiB }
max_runners: 1
setup_script: |
  dnf install -y git make gcc
mise_toml: |
  [tools]
  node = "24"
  "npm:@openai/codex" = "latest"
agent:
  start:  ["codex", "exec", "--json", "--dangerously-bypass-approvals-and-sandbox", "--dangerously-bypass-hook-trust", "{{.Prompt}}"]
  resume: ["codex", "exec", "--json", "--dangerously-bypass-approvals-and-sandbox", "--dangerously-bypass-hook-trust", "resume", "{{.AgentSessionID}}", "{{.Prompt}}"]
  secrets: { CODEX_API_KEY: codex_api_key }
  # or: secrets: { CODEX_ACCESS_TOKEN: codex_pat }
  turn_timeout: 2h
  files:
    - path: "{{.Home}}/.codex/config.toml"
      content: |
        [mcp_servers.wrangl]
        command = "wrangl"
        args = ["runner", "mcp"]
        required = true
    - path: "{{.Home}}/.codex/hooks.json"
      content: |
        {"hooks": {
          "SessionStart":      [{"hooks":[{"type":"command","command":"wrangl runner hook SessionStart"}]}],
          "PostToolUse":       [{"hooks":[{"type":"command","command":"wrangl runner hook PostToolUse","async":true}]}],
          "PermissionRequest": [{"hooks":[{"type":"command","command":"wrangl runner hook Notification"}]}],
          "Stop":              [{"hooks":[{"type":"command","command":"wrangl runner hook Stop"}]}]}}
