# Claude Code, headless drive (the default; verified shape, see INSTALL.md section 8).
# One `claude -p` process per subtask, all resuming one session id.
#
# The `agent:` block becomes a named agent definition (here `claude`) allowed on this template.
# To share one agent across templates instead, create it once (`wrangl agent create`) and list
# it here with `agents: [claude]` in place of the `agent:` block. See INSTALL.md section 8.0.
name: go-claude
arch: arm64
min: { vcpu: 2, ram: 8GiB, disk: 40GiB }
max_runners: 2
max_sessions: 4          # concurrent agent sessions per runner (default 4), each in its own git worktree
setup_script: |
  dnf install -y git make gcc
mise_toml: |
  [settings]
  npm.package_manager = "npm"   # mise's default (aube) skips the postinstall that fetches claude's native binary

  [tools]
  go = "1.26"
  node = "24"
  "npm:@anthropic-ai/claude-code" = { version = "latest", npm_args = "--ignore-scripts=false" }
agent:
  start:  ["claude", "-p", "--session-id", "{{.SessionUUID}}", "--permission-mode", "bypassPermissions", "{{.Prompt}}"]
  resume: ["claude", "-p", "--resume", "{{.SessionUUID}}", "--permission-mode", "bypassPermissions", "{{.Prompt}}"]
  secrets: { CLAUDE_CODE_OAUTH_TOKEN: claude_oauth_token }
  auth:                                     # how the owner collects it; shown on Setup and by `wrangl agent auth claude`
    secret: claude_oauth_token
    command: claude setup-token
    note: a year-long inference token for Pro/Max/Team/Enterprise plans
  turn_timeout: 2h
  files:
    - path: .mcp.json
      content: '{"mcpServers":{"wrangl":{"command":"wrangl","args":["runner","mcp"]}}}'
    - path: .claude/settings.local.json
      content: |
        {"hooks": {
          "PostToolUse":  [{"hooks":[{"type":"command","command":"wrangl runner hook PostToolUse"}]}],
          "Notification": [{"hooks":[{"type":"command","command":"wrangl runner hook Notification"}]}],
          "Stop":         [{"hooks":[{"type":"command","command":"wrangl runner hook Stop"}]}]},
         "enableAllProjectMcpServers": true}
