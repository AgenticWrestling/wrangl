version: '3'

vars:
  BINARY: build/ssm
  INSTALL_PATH: "{{.HOME}}/bin/ssm"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the ssm binary to ./build/ssm
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -o {{.BINARY}} ./cmd/ssm
    sources:
      - cmd/ssm/**/*.go
      - go.mod
    generates:
      - "{{.BINARY}}"

  install:
    desc: Build and install ssm to ~/bin/ssm
    deps: [build]
    cmds:
      - cp {{.BINARY}} {{.INSTALL_PATH}}
      - echo "Installed to {{.INSTALL_PATH}}"

  build-wrangl:
    desc: Build wrangl for this host plus linux runner binaries (named by `uname -m`)
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -o build/wrangl ./cmd/wrangl
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o build/wrangl-linux-aarch64 ./cmd/wrangl
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o build/wrangl-linux-x86_64 ./cmd/wrangl
    sources:
      - cmd/wrangl/**/*
      - go.mod

  sqlc:
    desc: Regenerate wrangl's sqlc code (cmd/wrangl/internal/db/dbgen)
    dir: cmd/wrangl/internal/db
    cmds:
      - sqlc generate

  sqlc-check:
    desc: Fail if wrangl's generated sqlc code is stale
    dir: cmd/wrangl/internal/db
    cmds:
      - sqlc diff

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  clean:
    desc: Delete build artifacts
    cmds:
      - rm -rf build
