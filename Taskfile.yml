version: '3'

vars:
  WRANGL_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # -s -w drops the symbol table and DWARF (runners download this binary at boot and on
  # every self-upgrade); -trimpath keeps build paths out of it.
  WRANGL_LDFLAGS: -s -w -X github.com/agenticwrestling/wrangl/cmd/wrangl/internal/runner.Version={{.WRANGL_VERSION}}

tasks:
  default:
    cmds:
      - task: build-wrangl

  build-wrangl:
    desc: Build wrangl for this host plus linux runner binaries (named by `uname -m`)
    cmds:
      - mkdir -p build
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.WRANGL_LDFLAGS}}" -o build/wrangl ./cmd/wrangl
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "{{.WRANGL_LDFLAGS}}" -o build/wrangl-linux-aarch64 ./cmd/wrangl
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "{{.WRANGL_LDFLAGS}}" -o build/wrangl-linux-x86_64 ./cmd/wrangl
    sources:
      - cmd/wrangl/**/*
      - go.mod

  sqlc:
    desc: Regenerate wrangl's sqlc code (cmd/wrangl/internal/db/dbgen)
    dir: cmd/wrangl/internal/db
    cmds:
      - sqlc generate

  sqlc-check:
    desc: Fail if wrangl's generated sqlc code is stale
    dir: cmd/wrangl/internal/db
    cmds:
      - sqlc diff

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  prerelease:
    desc: "Prerelease checks: clean main in sync with origin, fmt/vet/tidy/sqlc/tests, release targets build, installer parses. Optional VERSION=v1.2.3 also checks the notes file and tag."
    cmds:
      - scripts/prerelease.sh {{.VERSION}}

  release:
    desc: "Release VERSION=v1.2.3: prerelease checks, build macOS arm64 + Linux x86_64/arm64, tag, publish a GitHub release using docs/releases/<VERSION>.md as notes"
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "usage: task release VERSION=v1.2.3 (write docs/releases/v1.2.3.md first)"
    cmds:
      - scripts/release.sh {{.VERSION}}

  clean:
    desc: Delete build artifacts
    cmds:
      - rm -rf build
